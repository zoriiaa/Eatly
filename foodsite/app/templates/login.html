<!DOCTYPE html>
<html lang="uk">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вхід - Eatly</title>
  <link rel="icon" href="../static/img/logo.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="../static/css/main.css" />
  <link rel="stylesheet" href="../static/css/login.css" />
</head>

<body>
 <header class="header">
      <div class="container">
        <button type="button" class="header__logo" onclick="window.location.href='/'">
          <img src="../static/img/logo.svg" alt="Eatly Logo" class="header__logo-icon" />
          <span class="header__logo-text">Eatly</span>
        </button>
        <nav class="header__nav">
          <ul>
            <li>
              <a class="header__nav-recipes" href="" target="findrecipes">
                Рецепти
              </a>
            </li>
            <li>
              <a href=""><img src="../static/img/Profile.svg" alt="Profile" /></a>
            </li>
          </ul>
        </nav>
      </div>
    </header>
  <main class="main">
    <div class="login-container">
      <h1 class="title">Вхід</h1>
      {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    <div class="flash-messages">
        {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
        {% endfor %}
    </div>
    {% endif %}
    {% endwith %}

      <form class="login-form" method="POST" action="{{ url_for('login') }}">
        <div class="form-group">
          <label class="form-label">E-mail або логін</label>
          <input type="email" name="email" class="form-input" placeholder="Example23@gmail.com" required>
        </div>
        <div class="form-group">
          <label class="form-label">Пароль</label>
          <div class="password-wrapper">
            <input type="password" name="psw" class="form-input password-input" placeholder="************" required>
            <img src="../static/img/eye-off.svg" alt="Toggle password" class="eye-icon">
          </div>
        </div>
        <div class="form-footer-top">
          <label class="form-label remember-label">
            <input type="checkbox" name="remember" class="form-input remember-input" id="rememberMe">
            Запам'ятати мене
          </label>
          <button type="button" class="login-link" onclick="window.location.href='/register'">Ще не маєте профілю?</button>
        </div>
        <div class="form-footer">
       <button type="submit" class="submit-btn">Увійти</button>
        </div>
      </form>
    </div>
  </main>
  <footer>
    <div class="footer__content">
      <div>
        <img class="footer__logo" src="../static/img/logo.svg" alt="Eatly Logo" />
        <span class="footer__logo-text">Eatly</span>
      </div>
      <div class="footer__links">
        <a href="#" class="footer__link">Контакти</a>
        <a href="#" class="footer__link">Про нас</a>
      </div>
    </div>
  </footer>
  <script src="../static/JS/login.js"></script>
</body>


</html>
