<!DOCTYPE html>
<html lang="uk">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Реєстрація - Eatly</title>
  <link rel="icon" href="images/logo.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/login.css" />
</head>

<body>
  <header class="header">
    <div class="container">
      <button type="button" class="header__logo" onclick="window.location.href='/'">
        <img src="images/logo.svg" alt="Eatly Logo" class="header__logo-icon" />
        <span class="header__logo-text">Eatly</span>
      </button>
      <nav class="header__nav">
        <ul>
          <li>
            <button type="button" class="header__nav-recipes" onclick="window.location.href='/recipes'">
              Рецепти
            </button>
          </li>
          <li>
            <button type="button" class="profile-btn" onclick="window.location.href='/profile/<name>/settings'">
              <img src="images/Profile.svg" alt="Profile" /></button>
          </li>
        </ul>
      </nav>
    </div>
  </header>
  <main class="main">
    <div class="login-container">
      <h1 class="title">Вхід</h1>

      <form class="login-form" method="POST" action="{{ url_for('login') }}">
        <div class="form-group">
          <label class="form-label">E-mail або логін</label>
          <input type="email" class="form-input" placeholder="Example23@gmail.com" required>
        </div>
        <div class="form-group">
          <label class="form-label">Пароль</label>
          <div class="password-wrapper">
            <input type="password" class="form-input password-input" placeholder="************" required>
            <img src="images/eye-off.svg" alt="Toggle password" class="eye-icon">
          </div>
        </div>
        <div class="form-footer-top">
          <label class="form-label remember-label">
            <input type="checkbox" class="form-input remember-input" id="rememberMe">
            Запам'ятати мене
          </label>
          <button type="button" class="login-link" onclick="window.location.href='/register'">Ще не маєте профілю?</button>
        </div>
        <div class="form-footer">
       <button type="submit" class="submit-btn">Увійти</button>
        </div>
      </form>
    </div>
  </main>
  <footer>
    <div class="footer__content">
      <div>
        <img class="footer__logo" src="images/logo.svg" alt="Eatly Logo" />
        <span class="footer__logo-text">Eatly</span>
      </div>
      <div class="footer__links">
        <a href="#" class="footer__link">Контакти</a>
        <a href="#" class="footer__link">Про нас</a>
      </div>
    </div>
  </footer>
  <script src="JS/login.js"></script>
</body>


</html>
